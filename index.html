<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osu!mania → Encore Break</title>
<style>
  :root{
    --night:#0d1424;
    --night-2:#141d33;
    --edge:#243154;
    --ink:#e8edfa;
    --ink-dim:#8494b8;
    --perfect:#00ffaa;
    --good:#ffdd00;
    --miss:#ff3c3c;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--night);color:var(--ink);
    font:15px/1.55 var(--sans);
    padding:28px 22px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  h1{
    font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0 0 4px;
  }
  .sub{color:var(--ink-dim);margin:0 0 26px;max-width:62ch}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  @media(max-width:860px){.cols{grid-template-columns:1fr}}
  .panel{
    background:var(--night-2);border:1px solid var(--edge);border-radius:10px;
    padding:16px;
  }
  .panel h2{font-size:13px;font-weight:600;color:var(--ink-dim);margin:0 0 12px}
  #drop{
    border:1.5px dashed var(--edge);border-radius:8px;padding:26px 16px;
    text-align:center;color:var(--ink-dim);cursor:pointer;
    transition:border-color .15s,color .15s;
  }
  #drop:hover,#drop.over{border-color:var(--perfect);color:var(--ink)}
  #drop b{color:var(--ink);font-weight:600}
  textarea{
    width:100%;height:190px;margin-top:12px;resize:vertical;
    background:var(--night);color:var(--ink);border:1px solid var(--edge);
    border-radius:8px;padding:10px;font:12.5px/1.5 var(--mono);
  }
  textarea:focus,button:focus-visible{outline:2px solid var(--perfect);outline-offset:2px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:4px}
  input,select{
    width:100%;background:var(--night);color:var(--ink);
    border:1px solid var(--edge);border-radius:6px;padding:7px 9px;
    font:13px var(--sans);
  }
  pre{
    margin:0;background:var(--night);border:1px solid var(--edge);border-radius:8px;
    padding:12px;font:12.5px/1.6 var(--mono);overflow:auto;max-height:520px;
    white-space:pre;color:var(--ink);
  }
  button{
    background:var(--perfect);color:#06281d;border:0;border-radius:7px;
    padding:9px 15px;font:600 13px var(--sans);cursor:pointer;
  }
  button:disabled{background:var(--edge);color:var(--ink-dim);cursor:not-allowed}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .stats{display:flex;gap:18px;flex-wrap:wrap;font:12.5px var(--mono);color:var(--ink-dim);margin-bottom:12px}
  .stats b{color:var(--ink);font-weight:600}
  .msg{border-radius:7px;padding:9px 11px;margin-bottom:10px;font-size:13px;border:1px solid}
  .warn{border-color:var(--good);color:var(--good);background:rgba(255,221,0,.07)}
  .err{border-color:var(--miss);color:var(--miss);background:rgba(255,60,60,.07)}
  .empty{color:var(--ink-dim);font:13px var(--mono);padding:22px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>osu!mania → Encore Break</h1>
  <p class="sub">Solta o arquivo <code>.osu</code> da dificuldade e sai o ModuleScript pronto para colar em <code>ReplicatedStorage.Maps</code>. Nada é enviado para lugar nenhum — a conversão roda aqui na página.</p>

  <div class="cols">
    <div class="panel">
      <h2>Entrada</h2>
      <div id="drop" tabindex="0" role="button">
        <b>Solta o .osu aqui</b><br>ou clica para escolher
      </div>
      <input type="file" id="file" accept=".osu" hidden>
      <textarea id="raw" placeholder="…ou cola o conteúdo do .osu"></textarea>

      <div class="fields">
        <div>
          <label for="id">Nome do ModuleScript</label>
          <input id="id" placeholder="MusicTest3">
        </div>
        <div>
          <label for="genre">Gênero</label>
          <select id="genre">
            <option>Rock</option><option>Pop</option><option>Electronic</option>
            <option>HipHop</option><option>HeavyMetal</option><option>Jazz</option>
          </select>
        </div>
        <div>
          <label for="travel">travelTime (ms)</label>
          <input id="travel" type="number" value="1500">
        </div>
        <div>
          <label for="intensity">Intensidade da animação</label>
          <select id="intensity">
            <option>Normal</option><option>Calm</option><option>Heavy</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Saída</h2>
      <div id="messages"></div>
      <div class="bar">
        <button id="copy" disabled>Copiar</button>
        <span class="stats" id="stats"></span>
      </div>
      <pre id="out"><span class="empty">O ModuleScript aparece aqui</span></pre>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let currentLua = "";

function parseOsu(text){
  const errors = [], warnings = [];
  const lines = text.split(/\r?\n/);
  let section = "", cs = null, mode = null;
  const meta = {};
  const objects = [];

  for (const line of lines){
    const t = line.trim();
    if (!t || t.startsWith("//")) continue;
    if (t.startsWith("[") && t.endsWith("]")){ section = t.slice(1,-1); continue; }

    if (section === "General" || section === "Metadata" || section === "Difficulty"){
      const i = t.indexOf(":");
      if (i < 0) continue;
      const key = t.slice(0,i).trim(), val = t.slice(i+1).trim();
      if (key === "Mode") mode = parseInt(val,10);
      else if (key === "CircleSize") cs = parseFloat(val);
      else meta[key] = val;
    } else if (section === "HitObjects"){
      const p = t.split(",");
      if (p.length < 4) continue;
      const x = parseInt(p[0],10);
      const time = parseInt(p[2],10);
      const type = parseInt(p[3],10);
      if (!Number.isFinite(x) || !Number.isFinite(time) || !Number.isFinite(type)) continue;
      if (type & 8) continue;                    // spinner: não existe aqui
      let endTime = null;
      if (type & 128){                           // hold do mania
        const extra = (p[5] || "").split(":")[0];
        const e = parseInt(extra,10);
        if (Number.isFinite(e)) endTime = e;
      }
      objects.push({x, time, endTime});
    }
  }

  if (mode !== null && mode !== 3)
    errors.push("Este .osu não é osu!mania (Mode: " + mode + "). Só o modo mania vira lanes.");
  if (!objects.length)
    errors.push("Nenhuma nota encontrada na seção [HitObjects].");

  const keyCount = Math.round(cs || 4);
  if (keyCount !== 4 && keyCount !== 5)
    errors.push("O mapa tem " + keyCount + " colunas. O Encore Break só suporta 4K e 5K.");

  if (errors.length) return {errors, warnings};

  // Coluna = floor(x * colunas / 512), base 0. As lanes do jogo são base 1.
  const notes = [];
  let holds = 0, clamped = 0;
  for (const o of objects){
    let col = Math.floor(o.x * keyCount / 512);
    if (col < 0 || col > keyCount - 1){ clamped++; col = Math.min(Math.max(col,0), keyCount-1); }
    const note = {ms: o.time, lane: col + 1};
    if (o.endTime !== null){
      const dur = o.endTime - o.time;
      if (dur > 0){ note.hold = dur; holds++; }
    }
    notes.push(note);
  }

  notes.sort((a,b) => a.ms - b.ms);   // o motor avança um índice, então a ordem é obrigatória
  if (clamped) warnings.push(clamped + " nota(s) tinham coluna fora da faixa e foram encaixadas na borda.");
  if (notes[0].ms < 0) warnings.push("Há nota com tempo negativo. Confere o offset do áudio no osu!.");

  const last = notes[notes.length-1];
  const duration = (last.hold ? last.ms + last.hold : last.ms) / 1000;

  return {errors, warnings, notes, keyCount, holds, duration, meta};
}

function buildLua(r){
  const id = $("id").value.trim() || "NovaMusica";
  const title = (r.meta.Title || id).replace(/"/g,'\\"');
  const artist = (r.meta.Artist || "").replace(/"/g,'\\"');

  const body = r.notes.map(n =>
    n.hold ? `\t{${n.ms}, ${n.lane}, ${n.hold}};`
           : `\t{${n.ms}, ${n.lane}};`
  ).join("\n");

  return `-- ${id} (ModuleScript) -- ReplicatedStorage.Maps.${id}
-- Convertido de ${r.meta.Version ? '"' + r.meta.Version + '"' : "um .osu"} (osu!mania ${r.keyCount}K)

local module = {}

module.displayName = "${title}"
module.artist = "${artist}"
module.genre = "${$("genre").value}"
module.difficulty = 1

module.offset = 0
module.travelTime = ${parseInt($("travel").value,10) || 1500}
module.keyCount = ${r.keyCount}
module.intensity = "${$("intensity").value}"

module.backingTrack = "rbxassetid://0000000000"
module.stems = {
\tGuitar = "",
\tBass   = "",
\tDrums  = "",
\tPiano  = "",
}

module.notes = {
${body}
}

return module
`;
}

function render(text){
  const msgs = $("messages"), out = $("out"), stats = $("stats");
  msgs.innerHTML = ""; stats.textContent = "";

  if (!text.trim()){
    out.innerHTML = '<span class="empty">O ModuleScript aparece aqui</span>';
    $("copy").disabled = true; currentLua = ""; return;
  }

  const r = parseOsu(text);
  for (const e of r.errors)   msgs.insertAdjacentHTML("beforeend", `<div class="msg err">${e}</div>`);
  for (const w of r.warnings) msgs.insertAdjacentHTML("beforeend", `<div class="msg warn">${w}</div>`);

  if (r.errors.length){
    out.innerHTML = '<span class="empty">Corrige o que está acima para gerar</span>';
    $("copy").disabled = true; currentLua = ""; return;
  }

  currentLua = buildLua(r);
  out.textContent = currentLua;
  $("copy").disabled = false;
  stats.innerHTML =
    `<span><b>${r.notes.length}</b> notas</span>` +
    `<span><b>${r.holds}</b> holds</span>` +
    `<span><b>${r.keyCount}K</b></span>` +
    `<span><b>${r.duration.toFixed(1)}s</b></span>`;
}

const raw = $("raw");
raw.addEventListener("input", () => render(raw.value));
for (const el of ["id","genre","travel","intensity"])
  $(el).addEventListener("input", () => render(raw.value));

function readFile(f){
  const fr = new FileReader();
  fr.onload = () => {
    raw.value = fr.result;
    if (!$("id").value) $("id").value = f.name.replace(/\.osu$/i,"").replace(/[^A-Za-z0-9_]/g,"");
    render(raw.value);
  };
  fr.readAsText(f);
}

const drop = $("drop");
drop.addEventListener("click", () => $("file").click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") $("file").click(); });
$("file").addEventListener("change", e => e.target.files[0] && readFile(e.target.files[0]));
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over");
  if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]);
});

$("copy").addEventListener("click", async () => {
  await navigator.clipboard.writeText(currentLua);
  const b = $("copy"); b.textContent = "Copiado"; setTimeout(() => b.textContent = "Copiar", 1400);
});
</script>
</body>
</html>
